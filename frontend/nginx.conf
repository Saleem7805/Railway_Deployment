server {
    listen 80;
    root /usr/share/nginx/html;

    # the router owns every path, so anything not a real file falls through to index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # the API is a separate container; the browser only ever talks to this origin
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 30m;      # matches the upload limit
    }
}
